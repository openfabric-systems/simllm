name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e .[dev]
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q

  native-rnic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure RNIC model
        run: >-
          cmake -S simllm/backends/rnic -B build/rnic
          -DCMAKE_BUILD_TYPE=Debug
          -DSIMLLM_RNIC_BUILD_TESTS=ON
          -DSIMLLM_RNIC_BUILD_TOOLS=ON
          -DSIMLLM_RNIC_WARNINGS_AS_ERRORS=ON
      - name: Build RNIC model
        run: cmake --build build/rnic --parallel
      - name: Test RNIC model
        run: ctest --test-dir build/rnic --output-on-failure
      - name: Validate RNIC release sweep
        run: >-
          python examples/rnic_wq_v1/run_rnic_wq_v1.py
          --check
          --build-dir build/rnic_wq_v1_ci

  native-calibration-canonical:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install test dependencies
        run: pip install -e .[dev]
      - name: Configure independent canonical verifier
        run: >-
          cmake -S tests/native/calibration_canonical
          -B build/calibration-canonical
          -DCMAKE_BUILD_TYPE=Release
      - name: Build independent canonical verifier
        run: cmake --build build/calibration-canonical --parallel
      - name: Check cross-language canonical vectors
        run: pytest -q tests/test_calibration_canonical_native.py

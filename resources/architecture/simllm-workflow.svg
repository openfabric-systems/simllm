<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">SimLLM system workflow</title>
  <desc id="description">A high-level workflow from workload generation through a real framework scheduler, simulated GPU execution, packet-level network simulation, and request-level evidence. A feedback path shows the closed-loop virtual clock.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061633"/>
      <stop offset="1" stop-color="#041027"/>
    </linearGradient>
    <radialGradient id="cobalt-glow" cx="0.76" cy="0.38" r="0.72">
      <stop offset="0" stop-color="#204CFF" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#204CFF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#E1ECFF" stroke-opacity="0.025" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#E1ECFF" fill-opacity="0.72"/>
    </marker>
    <marker id="feedback-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#9EC3FF"/>
    </marker>
    <g id="stage-shell">
      <path d="M22 0H282A48 48 0 0 1 330 48V252A48 48 0 0 1 282 300H22" fill="#FFFFFF" fill-opacity="0.025" stroke="#FFFFFF" stroke-opacity="0.20" stroke-width="1.5"/>
      <rect x="22" y="37" width="18" height="18" rx="4" fill="#9EC3FF" fill-opacity="0.28"/>
      <rect x="49" y="37" width="18" height="18" rx="4" fill="#9EC3FF" fill-opacity="0.58"/>
      <rect x="76" y="37" width="18" height="18" rx="4" fill="#9EC3FF"/>
    </g>
  </defs>

  <rect width="1600" height="900" fill="url(#background)"/>
  <rect width="1600" height="900" fill="url(#cobalt-glow)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>

  <g font-family="Arial, Helvetica, sans-serif">
    <line x1="80" y1="54" x2="1520" y2="54" stroke="#FFFFFF" stroke-opacity="0.30"/>
    <text x="80" y="87" fill="#F7F9FC" font-size="13" letter-spacing="2.2">SIMLLM / SYSTEM WORKFLOW</text>
    <text x="1520" y="87" fill="#F7F9FC" font-size="13" letter-spacing="2.2" text-anchor="end">02 / 04</text>

    <text x="80" y="144" fill="#9EC3FF" font-size="14" font-weight="600" letter-spacing="2.4">REQUEST TO EVIDENCE</text>
    <text x="80" y="207" fill="#FFFFFF" font-size="58" font-weight="400" letter-spacing="-3.5">One causal workflow.</text>
    <text x="80" y="246" fill="#E1ECFF" fill-opacity="0.66" font-size="20" font-weight="400">Real scheduling decisions flow through virtual execution and a packet-level fabric.</text>

    <g transform="translate(80 292)">
      <use href="#stage-shell"/>
      <text x="300" y="51" fill="#E1ECFF" fill-opacity="0.72" font-size="12" letter-spacing="1.8" text-anchor="end">01</text>
      <text x="22" y="102" fill="#9EC3FF" font-size="12" font-weight="600" letter-spacing="1.7">SERVICE INPUT</text>
      <text x="22" y="151" fill="#FFFFFF" font-size="31" font-weight="400" letter-spacing="-1.1">Workload model</text>
      <text x="22" y="198" fill="#E1ECFF" fill-opacity="0.68" font-size="18">
        <tspan x="22" dy="0">Arrivals and request mix</tspan>
        <tspan x="22" dy="28">Prompt and output lengths</tspan>
        <tspan x="22" dy="28">Shared-prefix structure</tspan>
      </text>
    </g>

    <g transform="translate(450 292)">
      <use href="#stage-shell"/>
      <text x="300" y="51" fill="#E1ECFF" fill-opacity="0.72" font-size="12" letter-spacing="1.8" text-anchor="end">02</text>
      <text x="22" y="102" fill="#9EC3FF" font-size="12" font-weight="600" letter-spacing="1.7">REAL CONTROL</text>
      <text x="22" y="151" fill="#FFFFFF" font-size="31" font-weight="400" letter-spacing="-1.1">Framework scheduler</text>
      <text x="22" y="198" fill="#E1ECFF" fill-opacity="0.68" font-size="18">
        <tspan x="22" dy="0">vLLM or SGLang, unmodified</tspan>
        <tspan x="22" dy="28">Batching and token selection</tspan>
        <tspan x="22" dy="28">KV and prefix-cache state</tspan>
      </text>
    </g>

    <g transform="translate(820 292)">
      <use href="#stage-shell"/>
      <text x="300" y="51" fill="#E1ECFF" fill-opacity="0.72" font-size="12" letter-spacing="1.8" text-anchor="end">03</text>
      <text x="22" y="102" fill="#9EC3FF" font-size="12" font-weight="600" letter-spacing="1.7">VIRTUAL EXECUTION</text>
      <text x="22" y="151" fill="#FFFFFF" font-size="31" font-weight="400" letter-spacing="-1.1">GPU + collectives</text>
      <text x="22" y="198" fill="#E1ECFF" fill-opacity="0.68" font-size="18">
        <tspan x="22" dy="0">Roofline, profiles or traces</tspan>
        <tspan x="22" dy="28">TP allreduce and MoE all-to-all</tspan>
        <tspan x="22" dy="28">Pipeline activations</tspan>
      </text>
    </g>

    <g transform="translate(1190 292)">
      <use href="#stage-shell"/>
      <text x="300" y="51" fill="#E1ECFF" fill-opacity="0.72" font-size="12" letter-spacing="1.8" text-anchor="end">04</text>
      <text x="22" y="102" fill="#9EC3FF" font-size="12" font-weight="600" letter-spacing="1.7">PACKET FABRIC</text>
      <text x="22" y="151" fill="#FFFFFF" font-size="31" font-weight="400" letter-spacing="-1.1">RNIC + Clos</text>
      <text x="22" y="198" fill="#E1ECFF" fill-opacity="0.68" font-size="18">
        <tspan x="22" dy="0">htsim RNIC models</tspan>
        <tspan x="22" dy="28">Queues, packets and routing</tspan>
        <tspan x="22" dy="28">Congestion and flow completion</tspan>
      </text>
    </g>

    <g fill="none" stroke="#E1ECFF" stroke-opacity="0.62" stroke-width="1.5" marker-end="url(#arrow)">
      <path d="M413 442H447"/>
      <path d="M783 442H817"/>
      <path d="M1153 442H1187"/>
      <path d="M1355 594V647"/>
    </g>

    <rect x="80" y="650" width="1440" height="104" fill="#FFFFFF" fill-opacity="0.025"/>
    <line x1="80" y1="650" x2="1520" y2="650" stroke="#FFFFFF" stroke-opacity="0.26"/>
    <line x1="80" y1="754" x2="1520" y2="754" stroke="#FFFFFF" stroke-opacity="0.16"/>
    <line x1="590" y1="670" x2="590" y2="734" stroke="#FFFFFF" stroke-opacity="0.18"/>
    <line x1="1050" y1="670" x2="1050" y2="734" stroke="#FFFFFF" stroke-opacity="0.18"/>

    <text x="102" y="682" fill="#9EC3FF" font-size="12" font-weight="600" letter-spacing="1.8">05 / EVIDENCE LEDGER</text>
    <text x="102" y="724" fill="#FFFFFF" font-size="29" font-weight="400" letter-spacing="-0.6">TTFT / TPOT / GOODPUT</text>

    <text x="620" y="682" fill="#9EC3FF" font-size="12" font-weight="600" letter-spacing="1.8">OPEN LOOP</text>
    <text x="620" y="718" fill="#E1ECFF" fill-opacity="0.76" font-size="17">Record steps → GOAL trace → simulate once</text>

    <text x="1080" y="682" fill="#9EC3FF" font-size="12" font-weight="600" letter-spacing="1.8">CLOSED LOOP</text>
    <text x="1080" y="718" fill="#E1ECFF" fill-opacity="0.76" font-size="17">Completion → virtual clock → next batch</text>

    <path d="M1450 756V824H590C551 824 530 802 530 766V598" fill="none" stroke="#9EC3FF" stroke-opacity="0.86" stroke-width="2" marker-end="url(#feedback-arrow)"/>
    <rect x="845" y="807" width="360" height="34" fill="#061633"/>
    <text x="1025" y="830" fill="#9EC3FF" font-size="12" font-weight="600" letter-spacing="1.8" text-anchor="middle">CLOSED-LOOP VIRTUAL-TIME FEEDBACK</text>
  </g>
</svg>

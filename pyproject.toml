[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "simllm"
version = "0.0.1"
description = "Network-faithful simulation of LLM serving and training deployments"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "SimLLM contributors" }]
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "ruff>=0.4",
]
plot = [
    "matplotlib>=3.7",
]

[project.urls]
Homepage = "https://github.com/openfabric-systems/simllm"
Issues = "https://github.com/openfabric-systems/simllm/issues"

# SGLang discovers and runs this before constructing its Scheduler. The
# callable is a no-op unless SIMLLM_SGLANG_ENABLE=1, so an installed simllm
# never changes a real SGLang deployment by accident.
[project.entry-points."sglang.srt.plugins"]
simllm = "simllm.adapters.sglang.plugin:register"

[tool.setuptools.packages.find]
include = ["simllm*"]

[tool.setuptools.package-data]
"simllm.backends.rnic" = [
    "CMakeLists.txt",
    "README.md",
    "include/simllm/rnic/*.h",
    "src/*.cpp",
    "tests/*.h",
    "tests/*.cpp",
    "tools/*.cpp",
]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["third_party"]

[tool.pytest.ini_options]
testpaths = ["tests"]
